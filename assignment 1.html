<html>
    <head>
        <title> </title>

        <style>
             *{
                margin: 0;
                padding: 0;
                box-sizing: border-box; 
                 text-align: center;
             }

             body{
                font-weight: bold;
                font-size: 1.2em;
                font-family: Arial, Helvetica, sans-serif;
             }

             header ,nav ,footer{ 
                   border: 1px solid black;
                   margin: 20px 10px  ;
                   padding:40px;
                   background-color: rgb(150, 186, 201);
             }

            .body{
                display:flex;
                justify-content:center;
                gap:20px;
                margin:20px 10px;
            }

            .content{
                width:400px;
                height:390px;
                border:1px solid black;
                background-color: rgb(150, 186, 201);
                display:flex;
                justify-content:center;
                align-items:center;
            }

            .main-content{
                width:800px;
                height:390px;
                border:1px solid black;
                background-color: rgb(150, 186, 201);
                display:flex;
                justify-content:center;
                align-items:center;
            }

            .content{
                width:400px;
            }

            .main-content{
                 width:800px;
             }


        </style>

        
    </head>
    <body>
        
        <header>Header</header>
        <nav>Navigation bar</nav>
        
            <main>
                 <div class="body">
                    <div class="content">Content</div>
                    <div class="main-content">Main Content</div>
                    <div class="content">Content</div>
                 </div>
            </main>
        
        <footer>Footer</footer>
        
    </body>
</html>
